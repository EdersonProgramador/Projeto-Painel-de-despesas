<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Despesas</title>
    <style>
      :root {
        --background: #f4f7fb;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --text: #182230;
        --muted: #667085;
        --border: #d8dee8;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #c2410c;
        --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);

        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--background);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        color: #ffffff;
        background: var(--primary);
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .app {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 24px;
        width: min(1180px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px;
      }

      .sidebar,
      .form-card,
      .expenses-section {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .sidebar {
        align-self: start;
        position: sticky;
        top: 24px;
        padding: 24px;
      }

      .summary-card {
        border-radius: 20px;
        padding: 22px;
        color: #ffffff;
        background: linear-gradient(135deg, #2563eb, #1e40af);
      }

      .summary-label {
        margin-bottom: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.9rem;
      }

      .summary-total {
        display: block;
        font-size: 2rem;
        line-height: 1.1;
      }

      .summary-section {
        margin-top: 28px;
      }

      .summary-section h2,
      .form-card h2,
      .expenses-section h2 {
        font-size: 1.2rem;
      }

      .category-list,
      .expense-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .category-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .category-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-radius: 14px;
        padding: 12px;
        background: var(--surface-muted);
      }

      .category-list span {
        color: var(--muted);
      }

      .main-content {
        display: grid;
        align-content: start;
        gap: 24px;
      }

      .page-header {
        padding: 8px 4px;
      }

      .page-header p {
        color: var(--muted);
        font-weight: 700;
      }

      .page-header h1 {
        margin-top: 6px;
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1;
      }

      .form-card,
      .expenses-section {
        padding: 24px;
      }

      .expense-form {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 16px;
        margin-top: 18px;
      }

      .form-field {
        display: grid;
        gap: 8px;
      }

      .form-field label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .form-field input,
      .form-field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px 14px;
        color: var(--text);
        background: #ffffff;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: var(--primary);
        outline: 3px solid rgba(37, 99, 235, 0.16);
      }

      .form-error {
        grid-column: 1 / -1;
        min-height: 1.4em;
        color: var(--danger);
        font-weight: 700;
      }

      .expense-form button {
        grid-column: 1 / -1;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .section-header span {
        border-radius: 999px;
        padding: 6px 12px;
        color: var(--muted);
        background: var(--surface-muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .empty-message {
        border: 1px dashed var(--border);
        border-radius: 16px;
        padding: 24px;
        color: var(--muted);
        text-align: center;
        background: var(--surface-muted);
      }

      .expense-list {
        display: grid;
        gap: 12px;
      }

      .expense-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        background: #ffffff;
      }

      .expense-item div {
        display: grid;
        gap: 4px;
      }

      .expense-category {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .expense-value {
        white-space: nowrap;
        color: var(--primary);
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
          padding: 16px;
        }

        .sidebar {
          position: static;
        }

        .expense-form {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 520px) {
        .sidebar,
        .form-card,
        .expenses-section {
          border-radius: 18px;
          padding: 18px;
        }

        .expense-item,
        .section-header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar" aria-label="Resumo das despesas">
        <div class="summary-card">
          <p class="summary-label">Total geral</p>
          <strong id="total-expenses" class="summary-total">R$ 0,00</strong>
        </div>

        <section class="summary-section" aria-labelledby="category-summary-title">
          <h2 id="category-summary-title">Por categoria</h2>

          <ul class="category-list">
            <li>
              <span>Alimento</span>
              <strong id="total-Alimento">R$ 0,00</strong>
            </li>
            <li>
              <span>transporte</span>
              <strong id="total-transporte">R$ 0,00</strong>
            </li>
            <li>
              <span>lazer</span>
              <strong id="total-lazer">R$ 0,00</strong>
            </li>
            <li>
              <span>saúde</span>
              <strong id="total-saúde">R$ 0,00</strong>
            </li>
            <li>
              <span>outros</span>
              <strong id="total-outros">R$ 0,00</strong>
            </li>
          </ul>
        </section>
      </aside>

      <main class="main-content">
        <header class="page-header">
          <p>Controle financeiro simples</p>
          <h1>Painel de Despesas</h1>
        </header>

        <section class="form-card" aria-labelledby="form-title">
          <h2 id="form-title">Nova despesa</h2>

          <form id="expense-form" class="expense-form">
            <div class="form-field">
              <label for="title">Título</label>
              <input id="title" name="title" type="text" placeholder="Ex: Mercado" />
            </div>

            <div class="form-field">
              <label for="value">Valor</label>
              <input id="value" name="value" type="number" min="0.01" step="0.01" placeholder="0,00" />
            </div>

            <div class="form-field">
              <label for="category">Categoria</label>
              <select id="category" name="category">
                <option value="">Selecione</option>
                <option value="Alimento">Alimento</option>
                <option value="transporte">transporte</option>
                <option value="lazer">lazer</option>
                <option value="saúde">saúde</option>
                <option value="outros">outros</option>
              </select>
            </div>

            <p id="form-error" class="form-error" aria-live="polite"></p>

            <button type="submit">Adicionar despesa</button>
          </form>
        </section>

        <section class="expenses-section" aria-labelledby="expenses-title">
          <div class="section-header">
            <h2 id="expenses-title">Despesas adicionadas</h2>
            <span id="expense-count">0 itens</span>
          </div>

          <p id="empty-message" class="empty-message">Nenhuma despesa adicionada ainda.</p>
          <ul id="expense-list" class="expense-list"></ul>
        </section>
      </main>
    </div>

    <script>
      const categories = ["Alimento", "transporte", "lazer", "saúde", "outros"];
      let expenses = [];

      const form = getElement("#expense-form");
      const titleInput = getElement("#title");
      const valueInput = getElement("#value");
      const categorySelect = getElement("#category");
      const formError = getElement("#form-error");
      const expenseList = getElement("#expense-list");
      const emptyMessage = getElement("#empty-message");
      const totalElement = getElement("#total-expenses");
      const expenseCount = getElement("#expense-count");

      form.addEventListener("submit", handleSubmit);
      renderSummary();
      renderExpenses();

      function handleSubmit(event) {
        event.preventDefault();

        const title = titleInput.value.trim();
        const value = Number(valueInput.value);
        const category = categorySelect.value;

        if (!isValidCategory(category)) {
          showError("Selecione uma categoria válida.");
          return;
        }

        if (!title) {
          showError("Informe o título da despesa.");
          return;
        }

        if (!value || value <= 0) {
          showError("Informe um valor maior que zero.");
          return;
        }

        addExpense({
          id: createId(),
          titulo: title,
          valor: value,
          categoria: category,
        });

        form.reset();
        clearError();
        titleInput.focus();
      }

      function addExpense(expense) {
        expenses = [...expenses, expense];
        renderExpenses();
        renderSummary();
      }

      function renderExpenses() {
        expenseList.replaceChildren();

        emptyMessage.hidden = expenses.length > 0;
        expenseCount.textContent = `${expenses.length} ${expenses.length === 1 ? "item" : "itens"}`;

        for (const expense of expenses) {
          const item = document.createElement("li");
          item.className = "expense-item";

          const info = document.createElement("div");

          const title = document.createElement("strong");
          title.textContent = expense.titulo;

          const category = document.createElement("span");
          category.className = "expense-category";
          category.textContent = expense.categoria;

          const value = document.createElement("strong");
          value.className = "expense-value";
          value.textContent = formatCurrency(expense.valor);

          info.append(title, category);
          item.append(info, value);
          expenseList.append(item);
        }
      }

      function renderSummary() {
        totalElement.textContent = formatCurrency(calculateTotal());

        for (const category of categories) {
          const categoryTotal = document.getElementById(`total-${category}`);

          if (categoryTotal) {
            categoryTotal.textContent = formatCurrency(calculateTotalByCategory(category));
          }
        }
      }

      function calculateTotal() {
        return expenses.reduce((total, expense) => total + expense.valor, 0);
      }

      function calculateTotalByCategory(category) {
        return expenses
          .filter((expense) => expense.categoria === category)
          .reduce((total, expense) => total + expense.valor, 0);
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(value);
      }

      function showError(message) {
        formError.textContent = message;
      }

      function clearError() {
        formError.textContent = "";
      }

      function isValidCategory(category) {
        return categories.includes(category);
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }

        return String(Date.now());
      }

      function getElement(selector) {
        const element = document.querySelector(selector);

        if (!element) {
          throw new Error(`Elemento não encontrado: ${selector}`);
        }

        return element;
      }
    </script>
  </body>
</html>
